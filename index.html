<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>測試專案</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    h1 {
      color: blue;
    }
    .highlight {
      color: red;
      font-size: 2em;
    }
    .tongue-twister {
      font-size: 24px;
      color: purple;
    }
    .gray-text {
      color: gray;
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>
  <p class="highlight">Hello Claude</p>
  <p class="tongue-twister">吃葡萄不吐葡萄皮，不吃葡萄不吐葡萄皮</p>
  <p class="gray-text">站在巨人的肩膀上</p>
</body>
</html>
